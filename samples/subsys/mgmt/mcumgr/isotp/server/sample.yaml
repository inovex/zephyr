sample:
  name: MCUmgr ISO-TP (CAN) SMP server
  description: >
    MCUmgr SMP server exposed over the ISO-TP (CAN, ISO 15765-2) transport.
    Answers OS management commands received over a CAN bus.
common:
  tags:
    - mcumgr
    - smp
    - canbus
    - isotp
  # Interactive sample: it needs a host CAN interface (vcan) and a live SMP
  # client to do anything, so it is build-only under twister.
  build_only: true
tests:
  sample.mgmt.mcumgr.smp.isotp.server:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    depends_on:
      - can
