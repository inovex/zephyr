CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y

CONFIG_MCUMGR=y
CONFIG_SMP_CLIENT=y
CONFIG_MCUMGR_SMP_CLIENT_SHELL=y
# Image/file commands need MCUboot structures and a file system; the base
# shell (transport selection, echo, reset) is what is under test here.
CONFIG_MCUMGR_SMP_CLIENT_SHELL_IMG=n

# The same image also acts as the SMP server: the test transport loops
# client requests back into the local SMP processing.
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y

# Deny reset requests via the OS reset hook instead of rebooting the test.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y

CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
