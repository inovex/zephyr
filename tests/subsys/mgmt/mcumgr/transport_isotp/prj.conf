CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y

CONFIG_CAN=y
CONFIG_ISOTP=y
# ISO-TP buffer sizing for the test topology:
# - Buffers large enough for a full CAN FD frame (the FD scenario cannot make
#   progress with the tiny classic-CAN default).
# - Enough buffers for two full flow-control blocks (8 frames x 63 bytes) so
#   one block can sit in a receiver's fifo while the next is buffered.
# - One SF/FF buffer is held per bound context: up to two transport channels
#   plus two peer contexts are bound at once, and isotp_bind(K_FOREVER) blocks
#   when the pool runs dry.
CONFIG_ISOTP_RX_BUF_COUNT=16
CONFIG_ISOTP_RX_BUF_SIZE=128
CONFIG_ISOTP_RX_SF_FF_BUF_COUNT=5

CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_ISOTP=y
# The test starts the CAN controller itself, in loopback mode, so it can act
# as the ISO-TP peer of the transport on the same controller.
CONFIG_MCUMGR_TRANSPORT_ISOTP_AUTO_START=n

CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y

CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
